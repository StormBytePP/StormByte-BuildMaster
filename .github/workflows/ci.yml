name: CI

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ###########################################################################
  # 0a. Warm submodule cache (one save per OS — Actions cache is OS-scoped)
  ###########################################################################
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm repository + submodule cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: true
          enable-symlinks: true

  ###########################################################################
  # 0b. Warm APT lists (Linux only)
  ###########################################################################
  apt-bootstrap:
    runs-on: ubuntu-latest
    name: apt-bootstrap
    steps:
      - name: Warm APT package indexes
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists
          rotate-weekly: true

  ###########################################################################
  # LINUX — gcc + clang
  ###########################################################################
  harness-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]
    runs-on: ubuntu-latest
    name: linux-${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: true
          enable-symlinks: true

      - name: Install alternate toolchain tools
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: clang lld llvm
          cache-key: apt-harness-alt-tc-v1
          lists-cache-key: apt-lists
          rotate-weekly: true

      - name: Configure + main
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          source-dir: .github/tests/harness
          build-dir: build/harness
          build-type: Release
          target: run_buildmaster_main
          run-tests: false
          ccache-key: v1-harness
          cache-scope: ubuntu-latest-${{ matrix.toolchain }}

  ###########################################################################
  # macOS — clang + gcc
  ###########################################################################
  harness-macos:
    needs: [checkout-bootstrap]
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang, gcc]
    runs-on: macos-latest
    name: macos-${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: true
          enable-symlinks: true

      - name: Install GNU gcc
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: gcc

      - name: Configure + main
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          source-dir: .github/tests/harness
          build-dir: build/harness
          build-type: Release
          target: run_buildmaster_main
          run-tests: false
          ccache-key: v1-harness
          cache-scope: macos-latest-${{ matrix.toolchain }}

  ###########################################################################
  # WINDOWS — msvc + clang-cl
  ###########################################################################
  harness-windows:
    needs: [checkout-bootstrap]
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, clang-cl]
    runs-on: windows-latest
    name: windows-${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: true
          enable-symlinks: true

      - name: Configure + main
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          source-dir: .github/tests/harness
          build-dir: build/harness
          build-type: Release
          target: run_buildmaster_main
          run-tests: false
          ccache-key: v1-harness
          cache-scope: windows-latest-${{ matrix.toolchain }}
