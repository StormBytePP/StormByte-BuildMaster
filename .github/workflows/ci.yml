name: CI

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ###########################################################################
  # CMake style lint (advisory — continue-on-error)
  ###########################################################################
  lint-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pip + PyYAML (apt, cached)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: "python3-pip python3-yaml"
          cache-key: apt-cmake-lint-v1
          lists-cache-key: apt-lists
          rotate-weekly: true

      - name: Install cmakelang
        run: pip3 install --user "cmakelang==0.6.13"

      - name: Run cmake-lint
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          mapfile -t files < <(
            git ls-files \
              '*.cmake' \
              '*.cmake.in' \
              '*CMakeLists.txt' \
              | grep -vE '^\.github/tests/harness/fixtures/.+/lib/' \
              || true
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CMake listfiles to lint"
            exit 0
          fi
          echo "Linting ${#files[@]} file(s)"
          # Auto-loads .cmake-format.yaml / .cmake-format.json from repo root
          cmake-lint "${files[@]}"

  ###########################################################################
  # Harness (contract + smoke)
  ###########################################################################
  harness:
    needs: [lint-cmake]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: gcc
          - os: windows-latest
            toolchain: msvc
          - os: macos-latest
            toolchain: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure + smoke
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          source-dir: .github/tests/harness
          build-dir: build/harness
          build-type: Release
          target: run_buildmaster_smoke
          run-tests: false
          ccache-key: v1-harness
          cache-scope: ${{ matrix.os }}-${{ matrix.toolchain }}